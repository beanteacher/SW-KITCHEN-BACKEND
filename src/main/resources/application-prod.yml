# 비밀값이 git 에 남지 않도록 서버 환경 변수로만 받는다. 값이 없으면 앱이 뜨지 않는다
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

security:
  jwt:
    secret: ${JWT_SECRET}
  # 계정이 하나도 없을 때만 만든다. 첫 배포 뒤에는 빼도 된다
  initial-admin:
    user-id: ${ADMIN_USER_ID:}
    password: ${ADMIN_PASSWORD:}
  captcha:
    secret-key: ${TURNSTILE_SECRET_KEY}

encryption:
  privacy-key: ${PRIVACY_ENCRYPTION_KEY}
  cookie-key: ${COOKIE_ENCRYPTION_KEY}
portone:
  api-secret: ${PORTONE_API_SECRET}
oauth:
  redirect-base-url: ${SITE_URL}
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}

image:
  base-url: ${IMAGE_BASE_URL}
storage:
  bucket: ${S3_BUCKET}
# API 문서는 개발에서만 연다. 공개하면 관리자 API 목록이 밖에 드러난다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
