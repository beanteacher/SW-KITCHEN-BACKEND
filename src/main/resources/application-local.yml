# docker-compose.yml 의 MySQL
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sw_kitchen?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: sw_kitchen
    password: sw_kitchen

# 실행하는 쿼리를 ? 대신 들어간 값으로 채워 한 줄로 찍는다
decorator:
  datasource:
    enabled: true

security:
  # Safari 는 http://localhost 에서 Secure 쿠키를 저장하지 않는다. 운영(https)은 기본값(켬)을 쓴다
  cookie-secure: false
  jwt:
    secret: local-only-secret-change-me-0123456789abcdef   # 32바이트 이상
  # 계정이 하나도 없을 때만 만든다
  initial-admin:
    user-id: admin
    password: "1234"   # 이 비밀번호로 로그인하면 변경 안내가 뜬다
image:
  base-url: http://localhost:4566/sw-kitchen   # docker compose 의 LocalStack
storage:
  bucket: sw-kitchen
  endpoint: http://localhost:4566
