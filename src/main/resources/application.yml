spring:
  application:
    name: sw-kitchen-backend
  profiles:
    default: local                # 운영은 SPRING_PROFILES_ACTIVE=prod 로 켠다
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway 로만 바꾼다
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Seoul

security:
  jwt:
    access-token-ttl: 30m
    refresh-token-ttl: 14d
  # API 는 역할이 아니라 권한을 검사한다. 역할을 바꿀 때는 여기만 고친다
  role-permissions:
    CUSTOMER: []
    STAFF: [PRODUCT_MANAGE]
    ADMIN: [PRODUCT_MANAGE]

management:
  endpoints:
    web:
      exposure:
        include: health
