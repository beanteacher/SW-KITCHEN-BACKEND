spring:
  application:
    name: sw-kitchen-backend
  profiles:
    default: local                # 운영은 SPRING_PROFILES_ACTIVE=prod 로 켠다
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway 로만 바꾼다
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
      hibernate.default_batch_fetch_size: 100   # 여러 부모의 자식 목록을 IN 쿼리 한 번으로 읽는다
  flyway:
    locations: classpath:db/migration
  # 목록 페이지. ?page=1 부터 센다
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: true
  jackson:
    time-zone: Asia/Seoul
  # 이미지 업로드 한 파일 10MB. 요청 전체는 파일 말고 경계 문자열 등이 붙어 조금 넉넉히 둔다
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

security:
  jwt:
    access-token-ttl: 30m
    refresh-token-ttl: 14d
  # API 는 역할이 아니라 권한을 검사한다. 역할을 바꿀 때는 여기만 고친다
  role-permissions:
    CUSTOMER: []
    STAFF: [PRODUCT_MANAGE]
    ADMIN: [PRODUCT_MANAGE]

# 이미지 공개 주소 앞부분 (스토리지 또는 CDN). 뒤에 키를 붙인다

storage:
  region: ap-northeast-2        # 서울
management:
  endpoints:
    web:
      exposure:
        include: health
# 쿼리 로그(p6spy)는 기본으로 끈다. 로컬만 켠다
decorator:
  datasource:
    enabled: false
