spring:
  application:
    name: sw-kitchen-backend
  profiles:
    default: local                # 운영은 SPRING_PROFILES_ACTIVE=prod 로 켠다
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway 로만 바꾼다
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Seoul

management:
  endpoints:
    web:
      exposure:
        include: health
