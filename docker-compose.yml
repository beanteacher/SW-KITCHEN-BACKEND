# 로컬 개발용 MySQL. 실행: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sw_kitchen
      MYSQL_USER: sw_kitchen
      MYSQL_PASSWORD: sw_kitchen
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  # 로컬 개발용 S3. 켜질 때 버킷을 만든다. 무료판은 저장 내용을 남기지 않아 껐다 켜면 올린 이미지가 사라진다
  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack:/etc/localstack/init/ready.d:ro

volumes:
  mysql-data:
