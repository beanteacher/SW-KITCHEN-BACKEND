name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # 테스트가 Testcontainers 로 MySQL 을 띄운다. GitHub 러너에는 Docker 가 이미 있다
      - run: ./gradlew build
